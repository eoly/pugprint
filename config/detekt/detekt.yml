# Overrides layered on detekt's default config (buildUponDefaultConfig = true).
build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  # A ViewModel is one function per user action (UDF); splitting it would not reduce anything.
  TooManyFunctions:
    ignoreAnnotated: ['HiltViewModel']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
